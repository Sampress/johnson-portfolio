<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="card narrow" hidden>
    <h1>Admin login</h1>
    <form id="login-form" autocomplete="on">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <p class="muted"><a href="/">&larr; Back to site</a></p>
  </main>

  <!-- Dashboard -->
  <div id="dash-view" hidden>
    <header class="bar">
      <nav class="tabs">
        <button class="tab active" id="tab-works" type="button">Recent Works</button>
        <button class="tab" id="tab-messages" type="button">Messages <span id="badge" class="badge" hidden></span></button>
      </nav>
      <div>
        <a class="btn" href="/" target="_blank" rel="noopener">View site</a>
        <button class="btn" id="logout-btn" type="button">Log out</button>
      </div>
    </header>

    <!-- Works -->
    <main class="wrap" id="works-view">
      <section class="card">
        <h2 id="form-title">Add a work</h2>
        <form id="work-form">
          <input type="hidden" name="id">
          <input type="hidden" name="image">
          <label>Title <input name="title" maxlength="120" required></label>
          <label>Category <input name="category" maxlength="60" placeholder="e.g. Web Dev, Data Analysis"></label>
          <label>Image
            <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
          </label>
          <p id="image-note" class="muted"></p>
          <img id="preview" alt="" hidden>

          <h3 class="sub">Project page details <span class="muted">(shown on the project's own page — all optional)</span></h3>
          <label>Description <textarea name="description" rows="5" maxlength="2000" placeholder="What was the project, what problem did it solve? Leave a blank line between paragraphs."></textarea></label>
          <label>Technologies used <input name="tools" maxlength="300" placeholder="Separate with commas: React, Node.js, Power BI"></label>
          <label>My role <input name="role" maxlength="80" placeholder="e.g. Full stack developer"></label>
          <label>Result / impact <input name="result" maxlength="400" placeholder="e.g. Cut reporting time by 40%"></label>
          <label>Live link <input name="link" type="url" placeholder="https://..."></label>
          <label>GitHub link <input name="github" type="url" placeholder="https://github.com/..."></label>

          <p id="form-error" class="error" role="alert"></p>
          <div class="row">
            <button class="btn primary" type="submit" id="save-btn">Save</button>
            <button class="btn" type="button" id="cancel-btn" hidden>Cancel edit</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Your works</h2>
        <p id="empty" class="muted" hidden>Nothing here yet — add your first work.</p>
        <ul id="list" class="list"></ul>
      </section>
    </main>

    <!-- Messages -->
    <main class="wrap" id="messages-view" hidden>
      <section class="card">
        <h2>Messages from your contact form</h2>
        <p id="msg-empty" class="muted" hidden>No messages yet.</p>
        <ul id="msg-list" class="msgs"></ul>
      </section>
    </main>
  </div>
  <script src="admin.js"></script>
</body>
</html>
